<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Always Carry Bubbles</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8f8f5;
      color: #111;
      font-family: "Avenir Next", Arial, sans-serif;
      text-align: center;
      padding: 2rem;
    }

    main {
      max-width: 700px;
    }

    h1 {
      font-size: clamp(3rem, 8vw, 5rem);
      font-weight: 400;
      margin-bottom: 1rem;
      letter-spacing: 0.04em;
    }

    .tagline {
      font-size: clamp(1.25rem, 4vw, 2rem);
      font-weight: 300;
      margin-bottom: 2rem;
    }

    p {
      line-height: 1.7;
      font-size: 1.1rem;
    }
  </style>
</head>

<body>
  <main>
    <h1>Always Carry Bubbles</h1>

    <div class="tagline">
      Advancing Whimsy
    </div>

    <p>
      A small reminder to breathe, notice,
      and change the air around you.
    </p>
  </main>
</body>
</html>
